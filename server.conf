host = 127.0.0.1
port = 8080
dir = public
serve_static_root = true
php_root = public
# use the full path if php-cgi isn't on PATH.
php_bin = /opt/homebrew/bin/php-cgi
# Optional php-fpm/FastCGI target. Examples: 127.0.0.1:9000 or unix:/run/php/php-fpm.sock
php_fastcgi = off
# send unmatched paths to index.php with PATH_INFO.
php_index = index.php
php_front_controller = false
# only turn on /test.php when you need phpinfo() locally.
php_info_page = false
# forward unmatched paths to one URL or a list separated by commas or spaces.
proxy = off
#proxy = http://127.0.0.1:9000 weight=3, http://127.0.0.1:9001 weight=1
# how to pick the first target in the pool.
#upstream_policy = round_robin
# retry before sending the final response. use 0 for no retries.
#upstream_retries = 1
# take an origin out after repeated failures. after cooldown, let a few
# requests through first. upstream_max_failures = 0 disables passive ejection.
#upstream_max_failures = 2
#upstream_fail_timeout_ms = 10000
#upstream_circuit_breaker = true
#upstream_circuit_half_open_max = 1
#upstream_slow_start_ms = 10000
# reuse origin connections after complete responses. set max idle to 0 to turn it off.
#upstream_keepalive = true
#upstream_keepalive_max_idle = 16
#upstream_keepalive_idle_timeout_ms = 30000
#upstream_keepalive_max_requests = 100
# failed health checks take a target out until a probe passes.
#upstream_health_check = false
#upstream_health_check_path = /health
#upstream_health_check_interval_ms = 5000
#upstream_health_check_timeout_ms = 1000
# HTTP/3 runs over UDP and is still experimental.
#http3 = false
#http3_port = 8443
# Local admin socket. Commands: status, validate, validate-runtime, diff, restart, routes, upstreams, cert-renew, certs, metrics.
#admin_socket = /tmp/layerline-admin.sock
# web admin is off by default. first setup needs a token read from the server.
#admin_ui = false
#admin_ui_path = /_layerline/admin
#admin_credentials_path = .layerline-admin
# Structured JSON access logs are off by default. Use stderr for journald or a
# file path such as /var/log/layerline/access.log.
#access_log = off
# gzip for buffered text. use .br or .gz files next to static assets to keep sendfile.
#compression = false
#compression_min_bytes = 512
#compression_max_bytes = 1048576
#server_compression.example = true
#server_gzip_min_bytes.example = 1024
#route_compression.app = false
#route_gzip_min_bytes.app = 256
#server_route_compression.example.assets = true
# compression=true raises worker_stack_size to at least 524288 unless you set a higher value.

# domains and routes inherit global response headers.
#header = X-Frame-Options: DENY
#header = X-Content-Type-Options: nosniff
#security_headers = off
#server_header.example = Strict-Transport-Security: max-age=31536000
#route_header.app = Cache-Control: no-store
#server_route_header.example.app = X-App-Policy: isolated
# add Cache-Control at the matching scope.
#cache_control = public, max-age=60
#server_cache_control.example = private, max-age=30
#route_cache_control.app = no-store
#server_route_cache_control.example.assets = public, max-age=31536000, immutable
#stale_while_revalidate = 30
#server_stale_if_error.example = 300
#route_stale_if_error.app = 60
#server_route_stale_while_revalidate.example.assets = 600
# Opt-in memory cache for eligible static responses.
#response_cache = false
#response_cache_max_bytes = 16777216
#response_cache_max_entry_bytes = 262144
#response_cache_ttl_ms = 60000
#server_response_cache.example = true
#route_response_cache.assets = true
#route_response_cache_ttl_ms.assets = 300000
#server_route_security_headers.example.app = strict
# Redirect syntax: redirect = FROM TO [301|302|303|307|308]
# FROM can end in * for prefix matching; suffix is appended to TO.
#redirect = /old /new 308
#redirect = /docs/* /documentation/ 308

# route = NAME /path-or-prefix/* static|php|proxy
# routes inherit defaults unless you override them.
#route = assets /assets/* static
#route_dir.assets = public
#route_index.assets = index.html
#route_max_static_file_bytes.assets = 1048576
#route = app /app/* php
#route_php_root.app = public
#route_php_bin.app = /opt/homebrew/bin/php-cgi
#route_php_fastcgi.app = 127.0.0.1:9000
#route_php_index.app = index.php
#route_php_front_controller.app = true
#route_php_timeout_ms.app = 10000
#route = api /api/* proxy
#route_proxy.api = http://127.0.0.1:9000, http://127.0.0.1:9001
#route_proxy_timeout_ms.api = 15000
#route_upstream_policy.api = sticky_cookie
#route_upstream_retries.api = 2
#route_upstream_max_failures.api = 3
#route_upstream_fail_timeout_ms.api = 5000
#route_upstream_health_check.api = true
#route_upstream_health_check_path.api = /ready
#route_upstream_circuit_breaker.api = true

# put one .conf per site here. set tls_cert and tls_key in the site file
# if it needs its own certificate.
domain_config_dir = domains-enabled

# Native TLS 1.3 is built in. Provide an ECDSA P-256 or RSA cert/key pair for real HTTPS.
# Without cert/key, tls=true falls back to an ephemeral self-signed local cert.
#tls = false
tls_cert = /etc/ssl/certs/example.pem
tls_key = /etc/ssl/private/example.key
# optional automatic Let's Encrypt certbot settings (webroot mode)
#tls_auto = false
#letsencrypt_email = admin@example.com
#letsencrypt_domains = example.com,www.example.com
#letsencrypt_webroot = public
#letsencrypt_certbot = certbot
#letsencrypt_staging = false
#letsencrypt_renew = true
#letsencrypt_renew_interval_ms = 43200000

# Own port 80 while the main listener owns HTTPS. ACME HTTP-01 challenge files
# are served from letsencrypt_webroot; every other request redirects to HTTPS.
#http_redirect = false
#http_redirect_port = 80
#http_redirect_https_port = 443
#http_redirect_status = 308

# optional automatic Cloudflare DNS deployment
#cf_auto_deploy = false
#cf_api_base = https://api.cloudflare.com/client/v4
#cf_token = your-cloudflare-api-token
#cf_zone_id =
#cf_zone_name = example.com
#cf_record_name = www.example.com
#cf_record_type = A
#cf_record_content = 203.0.113.10
#cf_record_ttl = 300
#cf_record_proxied = false
#cf_record_comment = managed by Layerline

# max_concurrent_connections controls how many open socket handlers this process accepts at once.
# default in code: 1024 (one worker thread per socket)
#max_concurrent_connections = 1024

# Shared application allocator pages, with an admin/overload reserve included.
# This is not an RSS limit: stacks, kernel buffers and I/O internals are separate.
# Minimum 8388608 bytes; changing the budget requires a restart, not a reload.
#memory_budget_bytes = 536870912

# Managed file/socket/pipe reservations, including protected Unix control capacity.
# Linux/macOS; 32..1048576, restart-only, clamped by startup nofile and inherited FDs.
# This is not a connection count or a sandbox for child processes.
#descriptor_limit = 4096

# Restart-only I/O pool limits. Stacks are separate from the application heap.
#io_thread_limit = 128
#io_stack_size = 1048576
# close the connection after this many requests.
#max_requests_per_connection = 256
# worker_stack_size reduces per-thread memory footprint for high connection density.
# default/minimum in code: 262144; compression raises this to at least 524288.
#worker_stack_size = 262144
# Socket timeout policy in milliseconds.
# Header timeout covers the first request and partial headers.
# Idle timeout covers waiting for the next keep-alive request.
# Body/write/upstream timeouts bound request bodies, client writes, and proxy IO.
# write_timeout_ms is an absolute response transfer budget: HTTP/1 starts at its
# first response write; HTTP/2 starts at queueing and includes flow-control waits.
# Pre-response upstream operations and upgraded tunnels keep separate IO limits.
# Graceful shutdown timeout is how long SIGINT/SIGTERM drain active connections.
#read_header_timeout_ms = 10000
#read_body_timeout_ms = 30000
#idle_timeout_ms = 60000
#write_timeout_ms = 30000
#upstream_timeout_ms = 30000
# Certificate commands have a separate, positive deadline. CGI uses the
# upstream timeout above, including domain/route overrides.
#external_command_timeout_ms = 300000
#upstream_retries = 1
#upstream_max_failures = 2
#upstream_fail_timeout_ms = 10000
#upstream_keepalive = true
#upstream_keepalive_max_idle = 16
#upstream_keepalive_idle_timeout_ms = 30000
#upstream_keepalive_max_requests = 100
# php-fpm/FastCGI keep-alive pool. Uses FCGI_KEEP_CONN, then rotates by idle
# age and request count. Unsafe FastCGI responses are not pooled.
#fastcgi_keepalive = true
#fastcgi_keepalive_max_idle = 8
#fastcgi_keepalive_idle_timeout_ms = 30000
#fastcgi_keepalive_max_requests = 100
#graceful_shutdown_timeout_ms = 10000
# max_php_output_bytes caps bytes captured from php-cgi output to avoid per-request memory spikes.
# default in code: 2097152
#max_php_output_bytes = 2097152

max_request_bytes = 16384
max_body_bytes = 1048576
max_static_file_bytes = 10485760
